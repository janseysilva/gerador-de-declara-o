# Monta o instalador do "Declarações Escolares" num Windows do GitHub
# (PyInstaller + Inno Setup) e publica em Releases para baixar.
name: Instalador Declarações Escolares

# Só monta o instalador quando alguém pedir (aba Actions > Run workflow),
# não mais a cada mudança no código.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar componentes
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Teste rápido (ler alunos e gerar PDF/Word)
        run: |
          python -c "import tkinter, declaracoes_escolares as d; a=d.ler_lista('Nome;Sexo;Fase;Turma\nANA TESTE;F;1 PERIODO;A\n'); assert len(a)==1; p=d.paragrafos('matricula', a[0], {}, 2026); d.gerar_pdf('t.pdf', d.CONFIG_PADRAO, 'matricula', p, 'No 001/2026', ''); d.gerar_word('t.docx', d.CONFIG_PADRAO, 'matricula', p, 'No 001/2026', ''); print('ok')"

      - name: Testar o parecer do Gier (Gier de mentira, nomes inventados)
        run: python testes/teste_pareceres.py

      - name: Gerar o .exe (PyInstaller)
        run: python -m PyInstaller --noconfirm DeclaracoesEscolares.spec

      - name: Testar o .exe lendo um PDF do Gier (nomes inventados)
        run: |
          python testes/pdf_gier_exemplo.py "$PWD\gier_exemplo.pdf"
          Start-Process -FilePath "dist\DeclaracoesEscolares.exe" -ArgumentList "--testar-pdf", "`"$PWD\gier_exemplo.pdf`"", "`"$PWD\resultado.json`"" -Wait
          Get-Content resultado.json
          $r = Get-Content resultado.json -Raw | ConvertFrom-Json
          if (-not $r.parece_acompanhamento -or $r.criancas -ne 18) {
            Write-Error "O .exe não conseguiu ler o PDF do Gier"
            exit 1
          }

      - name: Testar o .exe entrando e buscando no Gier de teste (nomes inventados)
        run: |
          $srv = Start-Process python -ArgumentList "testes/gier_falso.py", "8765" -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 3
          $env:GIER_BASE = "http://127.0.0.1:8765"
          Start-Process -FilePath "dist\DeclaracoesEscolares.exe" -ArgumentList "--testar-gier", "`"$PWD\gier.json`"" -Wait
          Stop-Process -Id $srv.Id -ErrorAction SilentlyContinue
          Get-Content gier.json
          $r = Get-Content gier.json -Raw | ConvertFrom-Json
          if ($r.login -ne $true -or $r.senha_errada -ne "senha" -or $r.pdfs -ne 2 -or $r.criancas -ne 18) {
            Write-Error "O .exe não conseguiu buscar a frequência no Gier de teste"
            exit 1
          }

      - name: Testar o .exe lendo uma lista escaneada com o OCR (produtos inventados)
        run: |
          python testes/nota_escaneada_exemplo.py "$PWD\lista_exemplo.pdf"
          Start-Process -FilePath "dist\DeclaracoesEscolares.exe" -ArgumentList "--testar-nota", "`"$PWD\lista_exemplo.pdf`"", "`"$PWD\nota.json`"" -Wait
          Get-Content nota.json
          $r = Get-Content nota.json -Raw | ConvertFrom-Json
          if ($r.ocr_disponivel -ne $true -or $r.modelos_junto -ne $true -or $r.itens.Count -ne 6 -or $r.catalogo_federal -lt 1000 -or $r.modulos_novos -ne $true -or $r.aviso_de_versao -ne $true -or $r.senha_fraca -ne $true -or $r.dpapi -ne $true -or $r.pareceres -ne $true) {
            Write-Error "O .exe não conseguiu ler a lista escaneada, os catálogos ou os módulos novos"
            exit 1
          }

      - name: Gerar o instalador (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc /Osaida instalador_declaracoes.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem saida -Filter "Instalador_DeclaracoesEscolares.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: Instalador_DeclaracoesEscolares
          path: |
            saida/Instalador_DeclaracoesEscolares.exe
            dist/DeclaracoesEscolares.exe

      - name: Publicar em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $versao = (Select-String -Path declaracoes_escolares.py -Pattern 'VERSAO_PROGRAMA = "(.+)"').Matches[0].Groups[1].Value
          $tag = "v$versao-build${{ github.run_number }}"
          gh release create $tag saida/Instalador_DeclaracoesEscolares.exe `
            --target "${{ github.sha }}" `
            --title "Declarações Escolares $versao (build ${{ github.run_number }})" `
            --notes "Instalador do Declarações Escolares. Baixe o arquivo Instalador_DeclaracoesEscolares.exe abaixo e dê dois cliques."
